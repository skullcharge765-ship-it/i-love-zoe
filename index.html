<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart</title>

<style>

body{
    margin:0;
    background:black;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:monospace;
}

#boot{
    position:absolute;
    color:#ff4d6d;
    font-size:30px;
    letter-spacing:4px;
    animation:bootFade 3s forwards;
    text-shadow:0 0 10px #ff4d6d;
}

@keyframes bootFade{
    0%{opacity:1;}
    80%{opacity:1;}
    100%{opacity:0;}
}

#heartContainer{
    position:relative;
    width:700px;
    height:700px;
    opacity:0;
    animation:appear 2s forwards;
    animation-delay:3s;
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(0.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.word{
    position:absolute;
    color:#ff5c8a;
    font-size:18px;
    text-shadow:
        0 0 5px #ff5c8a,
        0 0 10px #ff5c8a,
        0 0 20px #ff0055;
    animation:glow 2s infinite alternate;
    white-space:nowrap;
}

@keyframes glow{
    from{
        opacity:0.5;
    }
    to{
        opacity:1;
        filter:brightness(2);
    }
}

.centerText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    color:white;
    font-size:70px;
    font-weight:bold;
    text-shadow:
        0 0 10px white,
        0 0 20px #ff0055,
        0 0 40px #ff0055;
    opacity:0;
    animation:centerShow 2s forwards;
    animation-delay:5s;
}

@keyframes centerShow{
    from{
        opacity:0;
        transform:translate(-50%, -50%) scale(0.5);
    }
    to{
        opacity:1;
        transform:translate(-50%, -50%) scale(1);
    }
}

</style>
</head>

<body>

<div id="boot">INITIALIZE BOOT UP...</div>

<div id="heartContainer">
    <div class="centerText">I Love you</div>
</div>

<script>

const container = document.getElementById("heartContainer");

function createHeart(){

    const total = 1200;

    for(let i = 0; i < total; i++){

        const t = Math.PI * 2 * Math.random();

        const x = 16 * Math.pow(Math.sin(t),3);
        const y =
            13 * Math.cos(t)
            -5 * Math.cos(2*t)
            -2 * Math.cos(3*t)
            -Math.cos(4*t);

        const scale = 18;

        const word = document.createElement("div");
        word.className = "word";

        word.innerText = "I love you";

        word.style.left = (350 + x * scale) + "px";
        word.style.top = (350 - y * scale) + "px";

        word.style.opacity = "0";

        container.appendChild(word);

        setTimeout(() => {
            word.style.transition = "1.2s";
            word.style.opacity = "1";
        }, 3000 + i * 4);
    }
}

createHeart();

</script>

</body>
</html>
